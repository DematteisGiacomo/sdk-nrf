CONFIG_BOOTLOADER_MCUBOOT=y

CONFIG_GPIO=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_REBOOT=y

# Retained boot mode, shared with MCUboot via dts/boot_mode.dtsi.
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_ZEPHYR_RAM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

# Minimal SMP server: accept MCUmgr "os reset" with boot mode so a host MCU can
# request MCUboot serial recovery while the application is running.
# No image group: with a single slot, MCUboot serial recovery performs the update.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_MCUMGR=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_RESET_BOOT_MODE=y
